<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>抽奖大转盘</title>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
/* === RESET & BASE === */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --pink: #FFB6C1; --pink-deep: #FF85A2; --lavender: #D8B5FF;
  --mint: #A8E6CF; --peach: #FFD3B6; --sky: #A8D8EA;
  --cream: #FFF8F0; --brown: #5D4037; --text: #4A3728;
}
body {
  font-family: 'Noto Sans SC', sans-serif;
  background: var(--cream);
  min-height: 100vh;
  display: flex; flex-direction: column; align-items: center;
  overflow-x: hidden;
  position: relative;
}

/* === ANIMATED BACKGROUND === */
.bg-animated {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  z-index: 0; pointer-events: none; overflow: hidden;
}
.bg-blob {
  position: absolute; border-radius: 50%;
  filter: blur(60px); opacity: 0.4;
  animation: blobFloat 20s ease-in-out infinite;
}
.bg-blob:nth-child(1) { width: 400px; height: 400px; background: #FFB6C1; top: -100px; left: -100px; animation-duration: 25s; }
.bg-blob:nth-child(2) { width: 350px; height: 350px; background: #D8B5FF; top: 50%; right: -80px; animation-duration: 30s; animation-delay: -5s; }
.bg-blob:nth-child(3) { width: 300px; height: 300px; background: #A8E6CF; bottom: -50px; left: 30%; animation-duration: 28s; animation-delay: -10s; }
.bg-blob:nth-child(4) { width: 250px; height: 250px; background: #FFD3B6; top: 30%; left: 60%; animation-duration: 22s; animation-delay: -15s; }
@keyframes blobFloat {
  0%, 100% { transform: translate(0, 0) scale(1); }
  25% { transform: translate(50px, -80px) scale(1.1); }
  50% { transform: translate(-30px, 60px) scale(0.9); }
  75% { transform: translate(70px, 40px) scale(1.05); }
}
.bg-shape {
  position: absolute; opacity: 0.15;
  animation: shapeDrift 15s linear infinite;
}
@keyframes shapeDrift {
  0% { transform: translateY(100vh) rotate(0deg); }
  100% { transform: translateY(-100px) rotate(360deg); }
}

/* === HEADER === */
.header {
  position: relative; z-index: 1;
  text-align: center; padding: 30px 20px 10px;
}
.header h1 {
  font-family: 'ZCOOL KuaiLe', cursive;
  font-size: clamp(2.2rem, 6vw, 3.5rem);
  color: #FF85A2;
  text-shadow: 2px 2px 0 #fff, 3px 3px 0 rgba(255,133,162,0.3);
  letter-spacing: 0.1em;
}
.header h1::before, .header h1::after {
  content: '◆'; font-size: 0.4em; vertical-align: middle;
  color: #FFB6C1; margin: 0 10px;
}
.header .subtitle {
  font-family: 'ZCOOL KuaiLe', cursive;
  font-size: 1rem; color: var(--brown); opacity: 0.5;
  letter-spacing: 0.15em;
}
.subtitle-row {
  display: flex; align-items: center; justify-content: center;
  gap: 12px; margin-top: 4px;
}
.stop-btn {
  padding: 5px 18px; border-radius: 20px;
  border: 2px solid #FF85A2;
  background: linear-gradient(135deg, #FFB6C1, #FF85A2);
  color: #fff; font-family: 'ZCOOL KuaiLe', cursive;
  font-size: 0.9rem; letter-spacing: 0.08em;
  cursor: pointer; transition: transform 0.2s, box-shadow 0.2s, opacity 0.3s;
  box-shadow: 0 3px 10px rgba(255,133,162,0.35);
}
.stop-btn:hover:not(:disabled) { transform: scale(1.07); box-shadow: 0 5px 14px rgba(255,133,162,0.45); }
.stop-btn:active:not(:disabled) { transform: scale(0.95); }
.stop-btn:not(:disabled) { animation: stopPulse 1.4s ease-in-out infinite; }
.stop-btn:disabled {
  background: #fff; color: rgba(93,64,55,0.35);
  border-color: rgba(255,182,193,0.5);
  box-shadow: none; cursor: not-allowed; opacity: 0.6;
}
.settle-btn {
  padding: 5px 18px; border-radius: 20px;
  border: 2px solid #A8E6CF;
  background: linear-gradient(135deg, #B5EAD7, #A8E6CF);
  color: #fff; font-family: 'ZCOOL KuaiLe', cursive;
  font-size: 0.9rem; letter-spacing: 0.08em;
  cursor: pointer; transition: transform 0.2s, box-shadow 0.2s, opacity 0.3s;
  box-shadow: 0 3px 10px rgba(168,230,207,0.35);
}
.settle-btn:hover:not(:disabled) { transform: scale(1.07); box-shadow: 0 5px 14px rgba(168,230,207,0.45); }
.settle-btn:active:not(:disabled) { transform: scale(0.95); }
.settle-btn:not(:disabled) { animation: settlePulse 1.4s ease-in-out infinite; }
.settle-btn:disabled {
  background: #fff; color: rgba(93,64,55,0.35);
  border-color: rgba(168,230,207,0.5);
  box-shadow: none; cursor: not-allowed; opacity: 0.6;
}
@keyframes settlePulse {
  0%, 100% { box-shadow: 0 3px 10px rgba(168,230,207,0.35); }
  50% { box-shadow: 0 3px 16px rgba(168,230,207,0.7); }
}
@keyframes stopPulse {
  0%, 100% { box-shadow: 0 3px 10px rgba(255,133,162,0.35); }
  50% { box-shadow: 0 3px 16px rgba(255,133,162,0.7); }
}

/* === MAIN === */
.main {
  position: relative; z-index: 1;
  display: flex; flex-direction: column; align-items: center;
  gap: 24px; padding: 10px 20px 40px;
}

/* === WHEEL === */
.wheel-wrap {
  position: relative;
  width: min(420px, 85vw); height: min(420px, 85vw);
}
.wheel-outer-ring {
  position: absolute; inset: -14px; border-radius: 50%;
  background: conic-gradient(from 0deg, #FFB6C1, #FFD3B6, #A8E6CF, #A8D8EA, #D8B5FF, #FFB6C1);
  box-shadow: 0 0 30px rgba(255,182,193,0.4), inset 0 0 20px rgba(255,255,255,0.3);
}
.wheel-outer-ring::before {
  content: ''; position: absolute; inset: 8px; border-radius: 50%; background: var(--cream);
}
.bulb {
  position: absolute; width: 10px; height: 10px; border-radius: 50%;
  background: #FFD3B6; box-shadow: 0 0 6px #FFD3B6;
  animation: bulbBlink 1.5s ease-in-out infinite alternate;
}
.bulb:nth-child(3n) { background: #FFB6C1; box-shadow: 0 0 6px #FFB6C1; animation-delay: 0.5s; }
.bulb:nth-child(3n+1) { background: #A8E6CF; box-shadow: 0 0 6px #A8E6CF; animation-delay: 1s; }
.bulb:nth-child(3n+2) { background: #D8B5FF; box-shadow: 0 0 6px #D8B5FF; animation-delay: 1.5s; }
@keyframes bulbBlink { 0% { opacity: 0.4; } 100% { opacity: 1; } }

.wheel-canvas-wrap {
  position: absolute; inset: 0; border-radius: 50%; overflow: hidden;
  transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99);
}
canvas#wheelCanvas { width: 100%; height: 100%; display: block; }

/* === CENTER BUTTON === */
.center-btn {
  position: absolute; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 72px; height: 72px; border-radius: 50%;
  border: 3px solid #FFB6C1;
  background: linear-gradient(135deg, #FFD3B6, #FFB6C1);
  color: #fff; font-family: 'ZCOOL KuaiLe', cursive;
  font-size: 1rem; cursor: pointer;
  box-shadow: 0 4px 15px rgba(255,182,193,0.4);
  z-index: 12; transition: transform 0.2s, box-shadow 0.2s, opacity 0.3s;
  display: flex; align-items: center; justify-content: center; line-height: 1.2;
}
.center-btn:hover { transform: translate(-50%, -50%) scale(1.08); box-shadow: 0 6px 20px rgba(255,182,193,0.5); }
.center-btn:active { transform: translate(-50%, -50%) scale(0.96); }
.center-btn.disabled {
  background: none;
  border: none;
  box-shadow: none;
  color: transparent;
}
.center-btn.disabled::before {
  content: '';
  position: absolute;
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background: conic-gradient(from 0deg, #FFB6C1, #D8B5FF, #A8E6CF, #FFD3B6, #FFB6C1);
  animation: spinLoader 1.5s linear infinite;
  box-shadow: 0 0 20px rgba(255,182,193,0.6);
}
.center-btn.disabled::after {
  content: '';
  position: absolute;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: rgba(255,255,255,0.9);
  animation: pulseLoader 1.5s ease-in-out infinite;
}
@keyframes spinLoader {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}
@keyframes pulseLoader {
  0%, 100% { transform: scale(1); opacity: 0.9; }
  50% { transform: scale(1.1); opacity: 1; }
}

/* === CENTER POINTER === */
.center-pointer {
  position: absolute;
  top: calc(50% - 36px - 28px);
  left: 50%;
  transform: translateX(-50%);
  width: 0; height: 0;
  border-left: 16px solid transparent;
  border-right: 16px solid transparent;
  border-bottom: 40px solid #FF4D6A;
  z-index: 11;
  filter: drop-shadow(0 2px 6px rgba(255,77,106,0.55));
  pointer-events: none;
}

/* === CENTER RESULT === */
.center-result {
  position: absolute; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  z-index: 15;
  background: rgba(255,255,255,0.95);
  backdrop-filter: blur(10px);
  border-radius: 16px; border: 2px solid #FFB6C1;
  padding: 12px 20px;
  font-family: 'ZCOOL KuaiLe', cursive;
  font-size: 1.2rem; color: var(--brown);
  text-align: center;
  box-shadow: 0 4px 20px rgba(255,182,193,0.4);
  opacity: 0; pointer-events: none;
  transition: opacity 0.3s ease;
  min-width: 140px;
}
.center-result.show { opacity: 1; }
.center-result.win {
  background: linear-gradient(135deg, #FFD3B6, #FFB6C1);
  color: #fff; font-weight: 700;
}
.center-result.retry {
  background: linear-gradient(135deg, #B5EAD7, #A8E6CF);
  color: #fff; font-weight: 700;
}

/* === CONTROLS === */
.controls { display: flex; flex-direction: column; align-items: center; gap: 14px; }
.spin-count-selector { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: center; }
.spin-count-selector label { font-family: 'ZCOOL KuaiLe', cursive; font-size: 1rem; color: var(--brown); }
.count-btn {
  width: 36px; height: 36px; border-radius: 50%;
  border: 2px solid #FFB6C1; background: #fff;
  font-family: 'ZCOOL KuaiLe', cursive; font-size: 1rem; color: var(--brown);
  cursor: pointer; transition: all 0.2s;
}
.count-btn:hover { background: #FFD3B6; }
.count-btn.active {
  background: linear-gradient(135deg, #FFD3B6, #FFB6C1);
  color: #fff; border-color: #FF85A2;
  box-shadow: 0 2px 8px rgba(255,182,193,0.3);
}
.count-dropdown {
  padding: 8px 12px; border-radius: 20px;
  border: 2px solid #FFB6C1; background: #fff;
  font-family: 'ZCOOL KuaiLe', cursive; font-size: 0.95rem; color: var(--brown);
  cursor: pointer; outline: none; transition: all 0.2s;
}
.count-dropdown:hover { background: #FFD3B6; }
.count-dropdown:focus { border-color: #FF85A2; }

/* === HISTORY === */
.history-panel {
  width: min(420px, 85vw);
  background: rgba(255,255,255,0.7); backdrop-filter: blur(10px);
  border-radius: 16px; border: 1px solid rgba(255,182,193,0.3);
  padding: 16px; max-height: 200px; overflow-y: auto;
}
.reset-btn {
  padding: 4px 12px; border-radius: 12px;
  border: 1px solid #FFB6C1; background: #fff; color: var(--brown);
  font-family: 'Noto Sans SC', sans-serif; font-size: 0.8rem;
  cursor: pointer; transition: all 0.2s;
}
.reset-btn:hover { background: #FFD3B6; transform: scale(1.05); }
.history-panel h3 {
  font-family: 'ZCOOL KuaiLe', cursive;
  color: #FF85A2; font-size: 1rem; margin-bottom: 8px;
}
.history-list { list-style: none; }
.history-list li {
  padding: 4px 0; font-size: 0.85rem; color: var(--text);
  border-bottom: 1px dashed rgba(255,182,193,0.3);
  display: flex; justify-content: space-between;
}
.history-list li:last-child { border-bottom: none; }
.history-list .prize-name { font-weight: 700; }
.history-list .prize-name.win { color: var(--pink-deep); }
.history-list .round-label { opacity: 0.5; font-size: 0.75rem; }
.history-panel::-webkit-scrollbar { width: 4px; }
.history-panel::-webkit-scrollbar-thumb { background: #FFB6C1; border-radius: 2px; }

/* === SUMMARY MODAL === */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.4);
  backdrop-filter: blur(4px);
  display: none; align-items: center; justify-content: center;
  z-index: 100;
}
.modal-overlay.show { display: flex; }
.modal {
  background: var(--cream); border-radius: 24px; border: 2px solid #FFB6C1;
  padding: 28px; max-width: 380px; width: 90%;
  text-align: center; position: relative;
  box-shadow: 0 20px 60px rgba(255,182,193,0.3);
  animation: modalIn 0.4s ease-out;
  max-height: 80vh; overflow-y: auto;
}
@keyframes modalIn { from { transform: scale(0.8) translateY(20px); opacity: 0; } to { transform: scale(1) translateY(0); opacity: 1; } }
.modal h2 {
  font-family: 'ZCOOL KuaiLe', cursive;
  color: #FF85A2; font-size: 1.4rem; margin-bottom: 12px;
}
.modal .summary-list { text-align: left; margin: 12px 0; }
.modal .summary-item {
  padding: 6px 10px; margin: 4px 0;
  border-radius: 10px; font-size: 0.95rem; color: var(--text);
  display: flex; justify-content: space-between; align-items: center;
}
.modal .summary-item.win {
  background: linear-gradient(135deg, rgba(255,211,182,0.4), rgba(255,182,193,0.4));
  font-weight: 700;
}
.modal .summary-item.retry {
  background: linear-gradient(135deg, rgba(181,234,215,0.4), rgba(168,230,207,0.4));
  font-weight: 700;
}
.modal .summary-item .tag {
  font-size: 0.75rem; padding: 2px 6px; border-radius: 6px;
  background: rgba(255,255,255,0.6);
}
.modal .summary-extra {
  margin: 12px 0; padding: 10px;
  background: linear-gradient(135deg, rgba(181,234,215,0.3), rgba(168,230,207,0.3));
  border-radius: 12px; font-family: 'ZCOOL KuaiLe', cursive;
  font-size: 1rem; color: #1B5E20;
}
.modal .close-btn {
  margin-top: 12px; padding: 10px 32px;
  border-radius: 24px; border: 2px solid #FFB6C1;
  background: linear-gradient(135deg, #FFD3B6, #FFB6C1);
  color: #fff; font-family: 'ZCOOL KuaiLe', cursive;
  font-size: 1rem; cursor: pointer; transition: transform 0.2s;
}
.modal .close-btn:hover { transform: scale(1.05); }

/* === PROB ADJUST BUTTON === */
.prob-adjust-btn {
  padding: 6px 18px; border-radius: 20px;
  border: 2px solid #FFB6C1; background: #fff;
  font-family: 'ZCOOL KuaiLe', cursive; font-size: 0.9rem;
  color: var(--brown); cursor: pointer; transition: all 0.2s;
  margin-top: 4px;
}
.prob-adjust-btn:hover { background: #FFD3B6; transform: scale(1.05); }

/* === PROB MODAL === */
.prob-modal .prob-list { text-align: left; margin: 12px 0; }
.prob-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 6px 0; border-bottom: 1px dashed rgba(255,182,193,0.3);
  gap: 8px;
}
.prob-row:last-child { border-bottom: none; }
.prob-row .prob-label {
  flex: 1; font-size: 0.95rem; color: var(--text); font-weight: 600;
  display: flex; align-items: center; gap: 6px;
}
.prob-row .prob-dot {
  width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0;
}
.prob-row input[type="number"] {
  width: 70px; padding: 5px 8px; border-radius: 10px;
  border: 2px solid #FFB6C1; font-family: 'Noto Sans SC', sans-serif;
  font-size: 0.9rem; color: var(--brown); text-align: center;
  outline: none; transition: border-color 0.2s;
  -moz-appearance: textfield;
}
.prob-row input[type="number"]::-webkit-inner-spin-button,
.prob-row input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
.prob-row input:focus { border-color: #FF85A2; }
.prob-total {
  margin: 10px 0; padding: 8px 12px; border-radius: 10px;
  font-family: 'ZCOOL KuaiLe', cursive; font-size: 0.95rem;
  text-align: center;
}
.prob-total.ok { background: rgba(168,230,207,0.3); color: #2E7D53; }
.prob-total.err { background: rgba(255,182,193,0.3); color: #922B3E; }
.prob-apply-btn {
  margin-top: 8px; padding: 8px 28px; border-radius: 20px;
  border: 2px solid #FFB6C1;
  background: linear-gradient(135deg, #FFD3B6, #FFB6C1);
  color: #fff; font-family: 'ZCOOL KuaiLe', cursive;
  font-size: 0.95rem; cursor: pointer; transition: transform 0.2s;
}
.prob-apply-btn:hover:not(:disabled) { transform: scale(1.05); }
.prob-apply-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.prob-reset-link {
  display: inline-block; margin-top: 6px; font-size: 0.8rem;
  color: var(--brown); opacity: 0.5; cursor: pointer;
  text-decoration: underline; border: none; background: none;
  font-family: 'Noto Sans SC', sans-serif;
}
.prob-reset-link:hover { opacity: 0.8; }

/* === CONFETTI === */
.confetti-container { position: fixed; inset: 0; pointer-events: none; z-index: 99; overflow: hidden; }
.confetti-piece {
  position: absolute; width: 10px; height: 10px; top: -20px;
  animation: confettiFall linear forwards;
}
@keyframes confettiFall {
  0% { transform: translateY(0) rotate(0deg); opacity: 1; }
  100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
}
</style>
</head>
<body>

<div class="bg-animated">
  <div class="bg-blob"></div><div class="bg-blob"></div>
  <div class="bg-blob"></div><div class="bg-blob"></div>
</div>

<div class="header">
  <h1>抽奖大转盘</h1>
  <div class="subtitle-row">
    <span class="subtitle">幸运转盘</span>
    <button class="stop-btn" id="stopBtn" onclick="stopSpin()" disabled>stop</button>
    <button class="settle-btn" id="settleBtn" onclick="settleSpin()" disabled>结算</button>
  </div>
</div>

<div class="main">
  <div class="wheel-wrap">
    <div class="wheel-outer-ring" id="outerRing"></div>
    <div class="wheel-canvas-wrap" id="wheelWrap">
      <canvas id="wheelCanvas" width="840" height="840"></canvas>
    </div>
    <div class="center-pointer"></div>
    <button class="center-btn" id="spinBtn" onclick="startSpin()">开始<br>抽奖</button>
    <div class="center-result" id="centerResult"></div>
  </div>

  <div class="controls">
    <div class="spin-count-selector">
      <label>抽奖次数：</label>
      <button class="count-btn active" data-count="1" onclick="setCount(1)">1</button>
      <button class="count-btn" data-count="2" onclick="setCount(2)">2</button>
      <button class="count-btn" data-count="3" onclick="setCount(3)">3</button>
      <button class="count-btn" data-count="4" onclick="setCount(4)">4</button>
      <button class="count-btn" data-count="5" onclick="setCount(5)">5</button>
      <select class="count-dropdown" onchange="setCount(parseInt(this.value))">
        <option value="">更多</option>
        <option value="6">6</option><option value="7">7</option>
        <option value="8">8</option><option value="9">9</option>
        <option value="10">10</option>
      </select>
    </div>
  </div>

  <div class="history-panel" id="historyPanel" style="display:none;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
      <h3 style="margin:0;">抽奖记录</h3>
      <button class="reset-btn" onclick="resetHistory()">重置</button>
    </div>
    <ul class="history-list" id="historyList"></ul>
  </div>

  <button class="prob-adjust-btn" onclick="openProbModal()">机率调整</button>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modal">
    <h2 id="modalTitle">抽奖统计</h2>
    <div id="modalBody"></div>
    <button class="close-btn" id="modalCloseBtn" onclick="closeSummary()">好的</button>
  </div>
</div>

<div class="modal-overlay" id="probModalOverlay">
  <div class="modal prob-modal">
    <h2>机率调整</h2>
    <p style="font-size:0.8rem;color:var(--brown);opacity:0.6;margin-bottom:8px;">调整一般抽奖机率（非保底），总和须为 100</p>
    <div class="prob-list" id="probList"></div>
    <div class="prob-total" id="probTotal"></div>
    <button class="prob-apply-btn" id="probApplyBtn" onclick="applyProb()">确定</button>
    <button class="prob-reset-link" onclick="resetProb()">恢复预设值</button>
    <br>
    <button class="close-btn" style="margin-top:10px;padding:6px 20px;font-size:0.85rem;" onclick="closeProbModal()">取消</button>
  </div>
</div>

<div class="confetti-container" id="confettiContainer"></div>

<script>
// ===================== PRIZE DATA =====================
const SECTORS = [
  { name: '谢谢惠顾',   prob: 35/3,  color: '#FFD3B6', textColor: '#5D4037' },
  { name: '50魅力值',   prob: 7.5,   color: '#A8E6CF', textColor: '#2E7D53' },
  { name: '黄马褂',     prob: 5,     color: '#F0D68A', textColor: '#5D4037' },
  { name: '谢谢惠顾',   prob: 35/3,  color: '#FFB6C1', textColor: '#5D4037' },

const TOTAL_DEG = 360;

// Pity pool: real prizes only, weights total exactly 100

const PITY_POOL = [
  { name: '50魅力值',   prob: 500/19,    color: '#A8E6CF', textColor: '#2E7D53' },
  { name: '黄马褂',     prob: 3500/171,  color: '#F0D68A', textColor: '#5D4037' },

let currentRotation = 0;
let pityCounter = 0;

function randomPityThreshold() {
  return Math.floor(Math.random() * 3) + 3;
}

// ===================== AUDIO =====================
let audioCtx = null;

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
}

function playTick() {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.frequency.value = 800;
  osc.type = 'sine';
  gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
  osc.start(audioCtx.currentTime);
  osc.stop(audioCtx.currentTime + 0.05);
}

function playWinSound() {
  if (!audioCtx) return;
  const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
  notes.forEach((freq, i) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.frequency.value = freq;
    osc.type = 'sine';
    const startTime = audioCtx.currentTime + i * 0.1;
    gain.gain.setValueAtTime(0, startTime);
    gain.gain.linearRampToValueAtTime(0.2, startTime + 0.05);
    gain.gain.exponentialRampToValueAtTime(0.01, startTime + 0.3);
    osc.start(startTime);
    osc.stop(startTime + 0.3);
  });
}

function playLoseSound() {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.frequency.value = 220;
  osc.type = 'sine';
  gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
  osc.start(audioCtx.currentTime);
  osc.stop(audioCtx.currentTime + 0.5);
}

// ===================== CANVAS DRAWING =====================
const canvas = document.getElementById('wheelCanvas');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const CX = W / 2, CY = H / 2, R = W / 2 - 4;

function drawWheel(highlightIdx) {
  ctx.clearRect(0, 0, W, H);
  let startAngle = -90 * (Math.PI / 180);

  SECTORS.forEach((sector, i) => {
    const sweepAngle = sector.angleDeg * (Math.PI / 180);
    const endAngle = startAngle + sweepAngle;
    const isHighlighted = i === highlightIdx;

    // Draw sector
    ctx.beginPath();
    ctx.moveTo(CX, CY);
    ctx.arc(CX, CY, R, startAngle, endAngle);
    ctx.closePath();

    if (isHighlighted) {
      // Glow effect
      ctx.fillStyle = lightenColor(sector.color, 40);
      ctx.fill();
      ctx.save();
      ctx.shadowColor = 'rgba(255,182,193,0.6)';
      ctx.shadowBlur = 30;
      ctx.fill();
      ctx.restore();
      // Bright border
      ctx.strokeStyle = '#FFB6C1';
      ctx.lineWidth = 3;
      ctx.stroke();
    } else {
      ctx.fillStyle = sector.color;
      ctx.fill();
      ctx.strokeStyle = 'rgba(212,168,67,0.35)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }

    // Inner decorative arc
    ctx.beginPath();
    ctx.moveTo(CX, CY);
    ctx.arc(CX, CY, R * 0.92, startAngle, endAngle);
    ctx.closePath();
    ctx.strokeStyle = isHighlighted ? 'rgba(255,182,193,0.4)' : 'rgba(212,168,67,0.12)';
    ctx.lineWidth = 1;
    ctx.stroke();

    // Text
    const midAngle = startAngle + sweepAngle / 2;
    const textR = R * 0.55;
    const chars = sector.name.split('');
    const charSpacing = 36;
    const fontSize = 36;

    ctx.save();
    ctx.translate(CX, CY);
    ctx.rotate(midAngle);
    ctx.font = `900 ${fontSize}px "Noto Sans SC", sans-serif`;
    ctx.fillStyle = isHighlighted ? '#FF85A2' : sector.textColor;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    if (isHighlighted) {
      ctx.shadowColor = 'rgba(255,133,162,0.5)';
      ctx.shadowBlur = 6;
    }

    chars.forEach((char, idx) => {
      const charR = textR + (idx - (chars.length - 1) / 2) * charSpacing;
      ctx.fillText(char, charR, 0);
    });

    ctx.restore();
    startAngle = endAngle;
  });

  // Center circle
  ctx.beginPath();
  ctx.arc(CX, CY, R * 0.12, 0, Math.PI * 2);
  ctx.fillStyle = '#FFF8F0';
  ctx.fill();
  ctx.strokeStyle = 'rgba(212,168,67,0.4)';
  ctx.lineWidth = 2;
  ctx.stroke();
}

function lightenColor(hex, percent) {
  const num = parseInt(hex.replace('#', ''), 16);
  const amt = Math.round(2.55 * percent);
  const R = Math.min(255, (num >> 16) + amt);
  const G = Math.min(255, ((num >> 8) & 0x00FF) + amt);
  const B = Math.min(255, (num & 0x0000FF) + amt);
  return '#' + (0x1000000 + R * 0x10000 + G * 0x100 + B).toString(16).slice(1);
}

// ===================== LIGHT BULBS =====================
function createBulbs() {
  const ring = document.getElementById('outerRing');
  const count = 24;
  const ringSize = ring.offsetWidth;
  const center = ringSize / 2;
  const bulbR = ringSize / 2 - 5;
  for (let i = 0; i < count; i++) {
    const angle = (i / count) * Math.PI * 2 - Math.PI / 2;
    const bulb = document.createElement('div');
    bulb.className = 'bulb';
    bulb.style.left = (center + Math.cos(angle) * bulbR - 5) + 'px';
    bulb.style.top = (center + Math.sin(angle) * bulbR - 5) + 'px';
    ring.appendChild(bulb);
  }
}

// ===================== PITY SYSTEM =====================
function determinePrize(forced) {
  if (forced) {
    const totalWeight = PITY_POOL.reduce((sum, s) => sum + s.prob, 0);
    let r = Math.random() * totalWeight;
    for (let i = 0; i < PITY_POOL.length; i++) {
      r -= PITY_POOL[i].prob;
      if (r <= 0) {
        // Find matching sector indices in SECTORS
        const candidates = [];
        SECTORS.forEach((s, idx) => { if (s.name === PITY_POOL[i].name) candidates.push(idx); });
        const sectorIdx = candidates[Math.floor(Math.random() * candidates.length)];
        return { prize: PITY_POOL[i], sectorIdx };
      }
    }
    const lastIdx = SECTORS.findIndex(s => s.name === PITY_POOL[PITY_POOL.length - 1].name);
    return { prize: PITY_POOL[PITY_POOL.length - 1], sectorIdx: lastIdx };
  }
  const totalWeight = SECTORS.reduce((sum, s) => sum + s.prob, 0);
  let r = Math.random() * totalWeight;
  for (let i = 0; i < SECTORS.length; i++) {
    r -= SECTORS[i].prob;
    if (r <= 0) {
      return { prize: SECTORS[i], sectorIdx: i };
    }
  }
  return { prize: SECTORS[SECTORS.length - 1], sectorIdx: SECTORS.length - 1 };
}

function weightedPick(pool) {
  const totalWeight = pool.reduce((sum, s) => sum + s.prob, 0);
  let r = Math.random() * totalWeight;
  for (const s of pool) {
    r -= s.prob;
    if (r <= 0) return s;
  }
  return pool[pool.length - 1];
}

function processOneSpin() {
  const { prize, sectorIdx } = determinePrize(false);

  if (prize.name === '再来一次') {
    // 再来一次: doesn't count as win or loss
    return { prize, sectorIdx, isRetry: false, isFreeSpin: true };
  }

  if (prize.name === '谢谢惠顾') {
    pityCounter++;
    if (pityCounter >= pityThreshold) {
      pityCounter = 0;
      pityThreshold = randomPityThreshold();
      const { prize: realPrize, sectorIdx: pitySectorIdx } = determinePrize(true);
      return { prize: realPrize, sectorIdx: pitySectorIdx, isPity: true, isFreeSpin: false };
    }
    return { prize, sectorIdx, isRetry: false, isFreeSpin: false };
  }

  // Real prize win
  pityCounter = 0;
  pityThreshold = randomPityThreshold();
  return { prize, sectorIdx, isRetry: false, isFreeSpin: false };
}

// ===================== SPIN LOGIC =====================
function setCount(n) {
  if (isSpinning) return;
  spinCount = n;
  document.querySelectorAll('.count-btn').forEach(btn => {
    btn.classList.toggle('active', parseInt(btn.dataset.count) === n);
  });
  const dropdown = document.querySelector('.count-dropdown');
  if (dropdown && n <= 5) dropdown.value = '';
}

function computeTargetAngle(sectorIndex) {
  // Calculate the angle of this sector's center from 12 o'clock (clockwise)
  let angleBeforeTarget = 0;
  for (let i = 0; i < sectorIndex; i++) {
    angleBeforeTarget += SECTORS[i].angleDeg;
  }
  const targetMid = angleBeforeTarget + SECTORS[sectorIndex].angleDeg / 2;
  // Calculate how much MORE to rotate from current position
  // We need: (targetMid + currentRotation + delta) % 360 = 0
  // So: delta = (360 - targetMid - currentRotation) % 360
  let baseRotation = (360 - targetMid - currentRotation) % 360;
  if (baseRotation < 0) baseRotation += 360;
  const extraSpins = (5 + Math.floor(Math.random() * 3)) * 360;
  return baseRotation + extraSpins;
}

async function startSpin() {
  if (isSpinning) return;
  initAudio(); // Initialize audio on first interaction
  isSpinning = true;
  spinAborted = false;
  spinSettled = false;
  const spinBtn = document.getElementById('spinBtn');
  spinBtn.classList.add('disabled');
  spinBtn.textContent = '';

  const results = [];
  const totalSpins = spinCount;
  const centerResult = document.getElementById('centerResult');
  const stopBtn = document.getElementById('stopBtn');
  const settleBtn = document.getElementById('settleBtn');

  for (let i = 0; i < totalSpins; i++) {
    // Check abort before each spin
    if (spinAborted) break;

    let result = processOneSpin();
    results.push(result);

    // If settled, skip animation for remaining spins
    if (spinSettled) {
      continue;
    }

    // Animate wheel
    const sectorIdx = result.sectorIdx;
    const targetAngle = computeTargetAngle(sectorIdx);

    // Start tick sounds during spin
    const tickInterval = setInterval(playTick, 100);
    stopBtn.disabled = false;
    settleBtn.disabled = false;
    await animateSpin(targetAngle);
    stopBtn.disabled = true;
    settleBtn.disabled = true;
    clearInterval(tickInterval);

    // Highlight winning sector
    highlightedSector = sectorIdx;
    drawWheel(sectorIdx);

    // Show result in center
    const isWin = result.prize.name !== '谢谢惠顾';
    const isFree = result.isFreeSpin;
    centerResult.textContent = result.prize.name;
    centerResult.className = 'center-result show' + (isFree ? ' retry' : isWin ? ' win' : '');

    // Play result sound
    if (isWin && !isFree) {
      playWinSound();
      launchConfetti();
    } else if (!isFree) {
      playLoseSound();
    }

    // Wait before next spin
    if (i < totalSpins - 1) {
      await delay(1800);
    } else {
      await delay(2200);
    }

    // Check abort during wait - early settlement
    if (spinAborted) break;

    // Clear highlight and center result
    centerResult.classList.remove('show');
    highlightedSector = -1;
    drawWheel(-1);
    await delay(300);
  }

  // Record and show summary for completed spins (early settlement if aborted)
  if (results.length > 0) {
    // Add to history
    addHistory(results);

    // Show summary
    showSummary(results, results.length);
  }

  // Reset UI state
  isSpinning = false;
  spinAborted = false;
  spinSettled = false;
  stopBtn.disabled = true;
  settleBtn.disabled = true;
  spinBtn.classList.remove('disabled');
  spinBtn.innerHTML = '开始<br>抽奖';
  centerResult.classList.remove('show');
  highlightedSector = -1;
  drawWheel(-1);
}

function delay(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

// Cubic-bezier easing solver (mirrors the CSS timing functions)
function makeBezierEase(p1x, p1y, p2x, p2y) {
  const cx = 3 * p1x, bx = 3 * (p2x - p1x) - cx, ax = 1 - cx - bx;
  const cy = 3 * p1y, by = 3 * (p2y - p1y) - cy, ay = 1 - cy - by;
  const sampleX = t => ((ax * t + bx) * t + cx) * t;
  const sampleY = t => ((ay * t + by) * t + cy) * t;
  const sampleDX = t => (3 * ax * t + 2 * bx) * t + cx;
  return function (x) {
    if (x <= 0) return 0;
    if (x >= 1) return 1;
    let t = x;
    for (let i = 0; i < 8; i++) {
      const dx = sampleX(t) - x;
      if (Math.abs(dx) < 1e-6) return sampleY(t);
      const d = sampleDX(t);
      if (Math.abs(d) < 1e-6) break;
      t -= dx / d;
    }
    let lo = 0, hi = 1; t = x;
    for (let i = 0; i < 40; i++) {
      const x2 = sampleX(t);
      if (Math.abs(x2 - x) < 1e-6) break;
      if (x > x2) lo = t; else hi = t;
      t = (lo + hi) / 2;
    }
    return sampleY(t);
  };
}

const SPIN_EASE = makeBezierEase(0.17, 0.67, 0.12, 0.99);
const STOP_EASE = makeBezierEase(0.22, 1, 0.36, 1);
const SPIN_DURATION = 4000;
const STOP_DURATION = 850;

// Holds the in-flight wheel animation so stopSpin() can retarget it
let activeSpin = null;

function animateSpin(targetAngle) {
  return new Promise(resolve => {
    const wrap = document.getElementById('wheelWrap');
    wrap.style.transition = 'none';

    let fromAngle = currentRotation;
    let toAngle = currentRotation + targetAngle;
    let duration = SPIN_DURATION;
    let easing = SPIN_EASE;
    let startTime = performance.now();
    let angle = fromAngle;
    let stopped = false;

    function frame(now) {
      let t = (now - startTime) / duration;
      if (t > 1) t = 1;
      angle = fromAngle + (toAngle - fromAngle) * easing(t);
      wrap.style.transform = `rotate(${angle}deg)`;
      if (t >= 1) {
        currentRotation = toAngle;
        activeSpin = null;
        resolve();
        return;
      }
      requestAnimationFrame(frame);
    }

    activeSpin = {
      // Cut the remaining full turns but keep the SAME landing sector,
      // so the pre-drawn prize (and therefore the odds) never changes.
      stop() {
        if (stopped) return;
        stopped = true;
        let target = toAngle;
        while (target - 360 >= angle + 120) target -= 360;
        fromAngle = angle;
        toAngle = target;
        duration = STOP_DURATION;
        easing = STOP_EASE;
        startTime = performance.now();
      }
    };

    requestAnimationFrame(frame);
  });
}

function stopSpin() {
  // Early settlement: let current spin complete, then stop remaining
  spinAborted = true;
}

function settleSpin() {
  // Instant settlement: calculate all remaining results immediately
  spinSettled = true;
  if (activeSpin) activeSpin.stop();
}

function showSummary(results, totalSpins) {

  let html = '<div class="summary-list">';
  results.forEach((r, i) => {
    const isWin = r.prize.name !== '谢谢惠顾' && !r.isFreeSpin;
    const isFree = r.isFreeSpin;

    if (isFree) tag = '<span class="tag">免费转</span>';

      <span>第${i + 1}次：${r.prize.name}</span>
      ${tag}
    </div>`;

  html += '</div>';

    html += `<div class="summary-extra">获得 ${freeSpins} 次免费抽奖机会！</div>`;

  overlay.classList.add('show');

// ===================== PROBABILITY ADJUSTMENT =====================
// Default probabilities for SECTORS (unique prizes)
const DEFAULT_PROBS = {
  '谢谢惠顾': 35,   // total across 3 sectors
  '50魅力值':  15,   // total across 2 sectors
  '黄马褂':    10,   // total across 2 sectors
  '斩马刀':    20,   // 1 sector
  '100魅力值': 10,   // 1 sector
  '回马枪':    5,    // 1 sector
  '再来一次':  5,    // 1 sector
};

// Count how many sectors each prize name has
function getSectorCounts() {
  const counts = {};
  SECTORS.forEach(s => { counts[s.name] = (counts[s.name] || 0) + 1; });
  return counts;
}

// Current user-adjusted probabilities (total = 100)
let userProbs = { ...DEFAULT_PROBS };

function applyProbsToSectors() {
  const counts = getSectorCounts();
  SECTORS.forEach(s => {
    s.prob = userProbs[s.name] / counts[s.name];
  });
}

function openProbModal() {
  if (isSpinning) return;
  const overlay = document.getElementById('probModalOverlay');
  const list = document.getElementById('probList');
  const counts = getSectorCounts();

  const uniquePrizes = Object.keys(DEFAULT_PROBS);
  let html = '';
  uniquePrizes.forEach(name => {
    const sector = SECTORS.find(s => s.name === name);
    const pct = userProbs[name];
    html += `<div class="prob-row">
      <span class="prob-label"><span class="prob-dot" style="background:${sector.color}"></span>${name}</span>
      <input type="number" min="0" max="100" step="0.1" value="${pct}" data-prize="${name}" oninput="updateProbTotal()">
      <span style="font-size:0.8rem;opacity:0.5;">%</span>
    </div>`;
  });
  list.innerHTML = html;
  updateProbTotal();
  overlay.classList.add('show');
}

function updateProbTotal() {
  const inputs = document.querySelectorAll('#probList input');
  let total = 0;
  inputs.forEach(inp => { total += parseFloat(inp.value) || 0; });
  const totalEl = document.getElementById('probTotal');
  const applyBtn = document.getElementById('probApplyBtn');
  totalEl.textContent = `总计：${total.toFixed(1)}%`;
  if (Math.abs(total - 100) < 0.01) {
    totalEl.className = 'prob-total ok';
    applyBtn.disabled = false;
  } else {
    totalEl.className = 'prob-total err';
    applyBtn.disabled = true;
  }
}

function applyProb() {
  const inputs = document.querySelectorAll('#probList input');
  inputs.forEach(inp => {
    userProbs[inp.dataset.prize] = parseFloat(inp.value) || 0;
  });
  applyProbsToSectors();
  drawWheel(-1);
  closeProbModal();
}

function resetProb() {
  userProbs = { ...DEFAULT_PROBS };
  applyProbsToSectors();
  // Update inputs in modal
  const inputs = document.querySelectorAll('#probList input');
  inputs.forEach(inp => { inp.value = userProbs[inp.dataset.prize]; });
  updateProbTotal();
  drawWheel(-1);
}

function closeProbModal() {
  document.getElementById('probModalOverlay').classList.remove('show');
}

function createFloatingShapes() {
  const bg = document.querySelector('.bg-animated');
  const shapes = ['circle', 'square', 'diamond'];
  const colors = [
    'rgba(255,182,193,0.25)', 'rgba(216,181,255,0.25)',
    'rgba(168,230,207,0.25)', 'rgba(255,211,182,0.25)',
    'rgba(168,216,234,0.25)'
  ];
  for (let i = 0; i < 15; i++) {
    const shape = document.createElement('div');
    shape.className = 'bg-shape';
    const size = 20 + Math.random() * 40;
    const color = colors[Math.floor(Math.random() * colors.length)];
    shape.style.width = size + 'px';
    shape.style.height = size + 'px';
    shape.style.background = color;
    shape.style.left = Math.random() * 100 + '%';
    shape.style.animationDuration = (10 + Math.random() * 20) + 's';
    shape.style.animationDelay = -(Math.random() * 15) + 's';
    const shapeType = shapes[Math.floor(Math.random() * shapes.length)];
    if (shapeType === 'circle') shape.style.borderRadius = '50%';
    else if (shapeType === 'diamond') shape.style.transform = 'rotate(45deg)';
    bg.appendChild(shape);
  }
}
